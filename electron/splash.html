<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Screenie</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI Variable Display", "Segoe UI", "SF Pro Display", system-ui, sans-serif; }
  .stage {
    position: relative; width: 460px; height: 460px; border-radius: 44px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 18%, #2a1f55 0%, #150f2c 55%, #0c0919 100%);
    box-shadow: 0 0 0 1px rgb(167 139 250 / 22%) inset;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: stage-in .55s cubic-bezier(.22, 1, .36, 1) both;
  }
  /* Bagliore che respira dietro al logo */
  .glow {
    position: absolute; width: 360px; height: 360px; left: 50%; top: 44%; translate: -50% -50%; border-radius: 50%;
    background: radial-gradient(circle, rgb(150 117 242 / 55%), transparent 65%); filter: blur(10px);
    animation: glow 2.4s ease-in-out .2s both;
  }
  /* Anello di luce che si allarga */
  .ring {
    position: absolute; left: 50%; top: 44%; width: 120px; height: 120px; translate: -50% -50%; border-radius: 50%;
    border: 2px solid rgb(196 181 253 / 70%); opacity: 0; animation: ring 1.1s cubic-bezier(.22, 1, .36, 1) .55s both;
  }
  .ring.two { animation-delay: .8s; }
  .logo { position: relative; width: 300px; height: 300px; margin-top: -24px; animation: logo-in .9s cubic-bezier(.34, 1.56, .64, 1) .15s both; }
  .logo .float { animation: float 2.6s ease-in-out 1.05s infinite; transform-origin: center; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink .32s ease-in-out 1.15s 2; }
  .badge { transform-box: fill-box; transform-origin: 20% 80%; animation: badge-in .6s cubic-bezier(.34, 1.56, .64, 1) .6s both; }
  .cursor { animation: cursor 1s steps(1) 1.2s infinite; }
  .spark { transform-box: fill-box; transform-origin: center; opacity: 0; animation: spark .5s cubic-bezier(.34, 1.56, .64, 1) both; }
  .spark:nth-child(1) { animation-delay: .95s; }
  .spark:nth-child(2) { animation-delay: 1.05s; }
  .spark:nth-child(3) { animation-delay: 1.15s; }
  .name {
    position: relative; margin-top: -6px; font-size: 54px; font-weight: 750; letter-spacing: -.045em; color: #fffdfb;
    background: linear-gradient(100deg, #fffdfb 0 40%, #c4b5fd 50%, #fffdfb 60% 100%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    animation: name-in .7s cubic-bezier(.22, 1, .36, 1) .7s both, shimmer 1.6s ease-in-out 1.3s both;
  }
  .bar { position: relative; width: 120px; height: 4px; margin-top: 22px; border-radius: 4px; background: rgb(255 255 255 / 10%); overflow: hidden; animation: fade .4s ease .9s both; }
  .bar::after { content: ""; position: absolute; inset: 0; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #a78bfa, #7652e8); animation: load 1.1s ease-in-out 1s infinite; }
  body.leaving .stage { animation: stage-out .36s cubic-bezier(.4, 0, 1, 1) both; }

  @keyframes stage-in { from { opacity: 0; transform: scale(.88); } }
  @keyframes stage-out { to { opacity: 0; transform: scale(1.06); filter: blur(6px); } }
  @keyframes logo-in { from { opacity: 0; transform: scale(.4) rotate(-12deg); } }
  @keyframes badge-in { from { opacity: 0; transform: scale(.2) translate(-40px, 30px); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes blink { 50% { transform: scaleY(.12); } }
  @keyframes cursor { 50% { opacity: 0; } }
  @keyframes spark { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
  @keyframes name-in { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } }
  @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes glow { 0% { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: .75; transform: scale(1); } }
  @keyframes ring { 0% { opacity: .9; width: 120px; height: 120px; } 100% { opacity: 0; width: 520px; height: 520px; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <div class="stage" role="img" aria-label="Screenie">
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="ring two"></div>
    <svg class="logo" viewBox="233 100 700 640" aria-hidden="true">
      <defs>
        <linearGradient id="screeniePurple" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#7652E8"/>
        </linearGradient>
        <linearGradient id="badgePurple" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6D4BD8"/><stop offset="1" stop-color="#392477"/>
        </linearGradient>
      </defs>
      <g class="float">
        <rect x="248" y="220" width="528" height="382" rx="82" fill="url(#screeniePurple)"/>
        <rect x="284" y="256" width="456" height="310" rx="55" fill="#100D20"/>
        <path d="M339 256h346L284 461V311q0-55 55-55Z" fill="#FFFFFF" opacity=".035"/>
        <rect class="eye" x="365" y="365" width="124" height="48" rx="24" fill="#FFFDFB"/>
        <rect class="eye" x="535" y="365" width="124" height="48" rx="24" fill="#FFFDFB"/>
        <path d="M456 602h112l30 70H426l30-70Z" fill="#5D42B8"/>
        <rect x="355" y="666" width="314" height="42" rx="21" fill="url(#screeniePurple)"/>
        <g class="badge">
          <rect x="604" y="478" width="252" height="174" rx="42" fill="url(#badgePurple)" stroke="#8B6AF1" stroke-width="12"/>
          <path d="m670 526 40 38-40 38" fill="none" stroke="#FFFDFB" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="cursor" d="M733 604h38" fill="none" stroke="#FFFDFB" stroke-width="17" stroke-linecap="round"/>
        </g>
        <g fill="#9675F2">
          <rect class="spark" x="742" y="132" width="32" height="76" rx="16" transform="rotate(15 758 170)"/>
          <rect class="spark" x="808" y="160" width="32" height="76" rx="16" transform="rotate(42 824 198)"/>
          <rect class="spark" x="864" y="225" width="32" height="76" rx="16" transform="rotate(78 880 263)"/>
        </g>
      </g>
    </svg>
    <div class="name">Screenie</div>
    <div class="bar"></div>
  </div>
<script>
  // Effetto sonoro sintetizzato: un "whoosh" d'ingresso, un arpeggio luminoso e due bip per le scintille.
  (function chime() {
    if (new URLSearchParams(location.search).get('sound') === '0') return;
    let ctx;
    try { ctx = new AudioContext(); } catch { return; }
    const master = ctx.createGain();
    master.gain.value = 0.22;
    const comp = ctx.createDynamicsCompressor();
    master.connect(comp).connect(ctx.destination);
    const t0 = ctx.currentTime + 0.08;

    // whoosh: rumore filtrato che sale
    const len = ctx.sampleRate * 0.7;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(300, t0);
    bp.frequency.exponentialRampToValueAtTime(3200, t0 + 0.55);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0, t0);
    ng.gain.linearRampToValueAtTime(0.35, t0 + 0.18);
    ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.7);
    noise.connect(bp).connect(ng).connect(master);
    noise.start(t0);

    function note(freq, start, dur, type = 'sine', vol = 0.5) {
      const o = ctx.createOscillator();
      const o2 = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type; o2.type = 'sine';
      o.frequency.value = freq; o2.frequency.value = freq * 2.001;
      const g2 = ctx.createGain(); g2.gain.value = 0.18;
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(vol, start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      o.connect(g); o2.connect(g2).connect(g); g.connect(master);
      o.start(start); o2.start(start); o.stop(start + dur + 0.05); o2.stop(start + dur + 0.05);
    }
    // arpeggio in Mi maggiore quando il logo atterra
    const a = t0 + 0.42;
    [[659.25, 0], [830.61, 0.09], [987.77, 0.18], [1318.5, 0.27]].forEach(([f, d]) => note(f, a + d, 1.2, 'triangle', 0.32));
    // accordo finale morbido
    [329.63, 493.88, 659.25].forEach((f) => note(f, a + 0.3, 1.6, 'sine', 0.16));
    // bip delle scintille e del battito di ciglia
    [0.95, 1.05, 1.15].forEach((d, i) => note(1760 + i * 220, t0 + d, 0.12, 'sine', 0.12));
  })();
</script>
</body>
</html>
