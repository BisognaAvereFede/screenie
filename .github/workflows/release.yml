# Pubblica una nuova versione: quando arriva un tag "v1.2.3", GitHub crea l'installer
# per Windows (con gli aggiornamenti automatici) e il .dmg per Mac, e li mette in una Release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Installer e pubblicazione
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    runs-on: macos-latest
    needs: windows # la Release la crea il job Windows; qui si aggiunge il .dmg
    continue-on-error: true # il Mac è sperimentale: se fallisce, la Release Windows resta valida
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Dmg (non firmato) e pubblicazione
        run: npx electron-builder --mac --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
